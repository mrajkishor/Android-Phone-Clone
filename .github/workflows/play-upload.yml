# Builds a signed Android App Bundle and uploads it to Google Play.
#
# Switched off until you set it up: it runs only when you start it (Actions → "Upload to Google Play"
# → Run workflow) or push a tag like `play-v4.2.2`, and it stops at the first step with a clear message
# if any of these repository secrets is missing (Settings → Secrets and variables → Actions):
#
#   PLAY_SERVICE_ACCOUNT_JSON   the Google Cloud service account's JSON key (invited in Play Console
#                               → Users and permissions, with release rights for PhoneHop)
#   UPLOAD_KEYSTORE_BASE64      the upload key file, base64:  base64 -w0 phone-clone-upload.jks
#   UPLOAD_STORE_PASSWORD       storePassword from key.properties
#   UPLOAD_KEY_PASSWORD         keyPassword from key.properties
#   UPLOAD_KEY_ALIAS            keyAlias from key.properties
#
# The first Play upload (4.2.2) is built from commit 1b57aa6: run the workflow with ref = 1b57aa6.
name: Upload to Google Play

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to build (4.2.2 = 1b57aa6)"
        default: main
        required: true
      track:
        description: "Play track"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "Release status (draft until the app has been published once)"
        type: choice
        options: [draft, completed, inProgress]
        default: draft
      user_fraction:
        description: "Rollout share for status inProgress, e.g. 0.2"
        default: "0.2"
  push:
    tags: ["play-v*"]

permissions:
  contents: read

concurrency:
  group: play-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PACKAGE: com.mrajkishor.phoneclone
      TRACK: ${{ inputs.track || 'internal' }}
      STATUS: ${{ inputs.status || 'draft' }}
    steps:
      - name: Check the Play secrets are set up
        env:
          A: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          B: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          C: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          D: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          E: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$A" ] || missing="$missing PLAY_SERVICE_ACCOUNT_JSON"
          [ -n "$B" ] || missing="$missing UPLOAD_KEYSTORE_BASE64"
          [ -n "$C" ] || missing="$missing UPLOAD_STORE_PASSWORD"
          [ -n "$D" ] || missing="$missing UPLOAD_KEY_PASSWORD"
          [ -n "$E" ] || missing="$missing UPLOAD_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Not set up yet. Add these repository secrets first:$missing (see docs/play-store/rollout-checklist.md, Phase 1)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Restore the upload key (never stored in the repo)
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_PW: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$STORE_PW" "$KEY_PW" "$ALIAS" > android/key.properties

      - name: Test
        run: flutter test

      - name: Build the signed App Bundle
        run: flutter build appbundle --release

      - name: Check it is signed with the upload key, not the debug key
        run: |
          out=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab)
          echo "$out" | head -5
          if echo "$out" | grep -q "CN=Android Debug"; then
            echo "::error::The bundle is signed with the debug key; check the UPLOAD_* secrets."
            exit 1
          fi

      - name: Keep the bundle as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneHop-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play (${{ env.TRACK }}, ${{ env.STATUS }})
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ env.TRACK }}
          status: ${{ env.STATUS }}
          userFraction: ${{ env.STATUS == 'inProgress' && inputs.user_fraction || '' }}

      - name: Remove the key from the runner
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
